# 边缘反向代理：统一入口，转发前端与后端（SSE 已关闭缓冲）
upstream la_frontend { server frontend:80; }
upstream la_backend  { server backend:8000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://la_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /docs { proxy_pass http://la_backend/docs; }
    location /openapi.json { proxy_pass http://la_backend/openapi.json; }
    location /health { proxy_pass http://la_backend/health; }

    location / {
        proxy_pass http://la_frontend;
        proxy_set_header Host $host;
    }
}
